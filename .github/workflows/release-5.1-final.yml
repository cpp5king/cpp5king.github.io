name: Assemble 5.1.0 final release

on:
  push:
    branches:
      - release-5.1.0-final
    paths:
      - .github/workflows/release-5.1-final.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-5.1.0-final
          fetch-depth: 0

      - name: Reassemble approved RC8 release package
        shell: bash
        run: |
          set -euo pipefail
          cat .release-upload/full*.b64 | base64 -d > /tmp/inspection-assistant-5.1.0-release.zip
          unzip -t /tmp/inspection-assistant-5.1.0-release.zip >/dev/null
          rm -rf /tmp/release-src
          mkdir -p /tmp/release-src
          unzip -oq /tmp/inspection-assistant-5.1.0-release.zip -d /tmp/release-src

          ROOT="/tmp/release-src"
          if [ ! -f "$ROOT/index.html" ]; then
            CANDIDATE=$(find /tmp/release-src -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/index.html" ]; then ROOT="$CANDIDATE"; fi
          fi
          test -f "$ROOT/index.html"
          test -d "$ROOT/data"
          test -d "$ROOT/src"
          test -d "$ROOT/icons"

          rm -rf data src icons
          cp -R "$ROOT/data" "$ROOT/src" "$ROOT/icons" .
          cp "$ROOT/index.html" "$ROOT/manifest.webmanifest" "$ROOT/service-worker.js" "$ROOT/start.cmd" .

      - name: Normalize formal version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
            Path('index.html'), Path('manifest.webmanifest'), Path('service-worker.js'),
            Path('data/app-meta.js'), Path('src/air-v1-ui.js'), Path('src/water-v2-ui.js')
          ]
          for p in paths:
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            s=s.replace('5.1.0-local-rc8','5.1.0')
            s=s.replace('local-rc8','release-5.1.0')
            p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('data/app-meta.js')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r"version:'[^']+'","version:'5.1.0'",s)
          s=re.sub(r"label:'[^']+'","label:'稽查助手5.1.0'",s)
          if re.search(r"build:'[^']+'",s):
            s=re.sub(r"build:'[^']+'","build:'release-5.1.0'",s)
          else:
            s=s.replace("provenance:'PP-IA-41-7F3C9A21'","build:'release-5.1.0',\n    provenance:'PP-IA-41-7F3C9A21'")
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('manifest.webmanifest')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'"name"\s*:\s*"稽查助手[^"]*"','"name": "稽查助手5.1.0"',s)
          s=re.sub(r'"start_url"\s*:\s*"[^"]*"','"start_url": "./index.html?v=5.1.0"',s)
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION='[^']+';","const VERSION='5.1.0';",s)
          s=re.sub(r"const CACHE_REVISION='[^']+';","const CACHE_REVISION='release-5.1.0';",s)
          s=re.sub(r"const CACHE_NAME='[^']+';","const CACHE_NAME='inspection-assistant-5.1.0-pp-7f3c9a21-release-5.1.0';",s)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY

      - name: Formal release validation
        shell: bash
        run: |
          set -euo pipefail

          # No development markers in runtime metadata/UI
          ! grep -R "5.1.0-local-rc8\|local-rc8" -n index.html manifest.webmanifest service-worker.js data/app-meta.js src/air-v1-ui.js src/water-v2-ui.js

          grep -q "version:'5.1.0'" data/app-meta.js
          grep -q "label:'稽查助手5.1.0'" data/app-meta.js
          grep -q "build:'release-5.1.0'" data/app-meta.js
          grep -q "PP-IA-41-7F3C9A21" data/app-meta.js
          grep -q '"name": "稽查助手5.1.0"' manifest.webmanifest
          grep -q '"start_url": "./index.html?v=5.1.0"' manifest.webmanifest
          grep -q "const VERSION='5.1.0';" service-worker.js
          grep -q "CACHE_REVISION='release-5.1.0';" service-worker.js

          # Official-law snapshot checks
          test -f data/law-fulltext.js
          grep -q "law.moj.gov.tw" data/law-fulltext.js
          grep -q "全國法規資料庫" data/law-fulltext.js
          python - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('data/law-fulltext.js').read_text(encoding='utf-8')
          m=re.search(r'Object\.freeze\((\{.*\})\);\}\)\(window\);',s,re.S)
          if not m: raise SystemExit('cannot parse law-fulltext.js')
          j=json.loads(m.group(1))
          entries=j.get('entries',{})
          if len(entries)!=14: raise SystemExit(f'expected 14 laws, got {len(entries)}')
          count=sum(sum(1 for a in e.get('articles',[]) if a.get('type')=='A') for e in entries.values())
          if count!=687: raise SystemExit(f'expected 687 articles, got {count}')
          for e in entries.values():
            if not str(e.get('sourceUrl','')).startswith('https://law.moj.gov.tw/'):
              raise SystemExit('non-MOJ source URL: '+str(e.get('sourceUrl')))
          print('laws=14 articles=687 source=law.moj.gov.tw')
          PY

          # Syntax + current regression suite
          for f in $(find data src -name '*.js' -type f); do node --check "$f" >/dev/null; done
          node tests/run-active-tests.cjs

          # PWA local-asset existence is covered by tests/pwa-v41.test.cjs above.\n          echo 'PWA static file check covered by regression suite'\n\n      - name: Commit final source to release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-upload
          rm -f .github/workflows/release-5.1-final.yml
          git config user.name "cpp5king"
          git config user.email "328029305+cpp5king@users.noreply.github.com"
          git add -A
          git commit -m "Release 5.1.0"
          git push origin HEAD:release-5.1.0-final

# validation rerun
