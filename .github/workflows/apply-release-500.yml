name: Apply release 5.0.0 payload

on:
  push:
    branches:
      - release/5.0.0
    paths:
      - '.release/release-5.0.0-delta.tar.xz'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/5.0.0
          fetch-depth: 0

      - name: Verify rc4 payload
        shell: bash
        run: |
          set -euo pipefail
          echo "f925f83bc562b79696065d2fc61760ffe83319c6387714c749edeba908af7651  .release/release-5.0.0-delta.tar.xz" | sha256sum -c -

      - name: Apply verified rc4 delta
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .release/release-5.0.0-delta.tar.xz -C .
          rm -f .release/release-5.0.0-delta.tar.xz
          rmdir .release 2>/dev/null || true
          rm -f .github/workflows/apply-release-500.yml

      - name: Run active tests
        run: node tests/run-active-tests.cjs

      - name: Commit release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Release 5.0.0"
          git push origin HEAD:release/5.0.0
