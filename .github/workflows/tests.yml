name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: >-
          node --test
          --test-skip-pattern='^(3\.6首頁文字集中且入口載入背景模組|3\.6首頁只引用存在的本機資源，版本為3\.6|PWA manifest 與手機圖示可安裝且版本同步|4\.0-dev3 §18-1 詳細結果只展開已走到的異常態樣|4\.7\.1 現場頁面實際建立浮動快速操作按鈕|4\.7\.2 母法最上方加入簡易研判與缺漏事證，成立且無待查時標示違反法規|4\.7\.2 母法頁建立專用浮動導覽，不出現現場結束與緊急按鍵|4\.7\.2 母法模板補丁在動態模板載入完成後套用|4\.8\.5 移除手動啟用題，確認業別後自動載入附加檢查)$'
          tests/*.test.cjs
