name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: >-
          node --test
          --test-skip-pattern='^(3\.6首頁文字集中且入口載入背景模組|3\.6首頁只引用存在的本機資源，版本為3\.6|PWA manifest 與手機圖示可安裝且版本同步|4\.0-dev3 §18-1 詳細結果只展開已走到的異常態樣|4\.7\.1 現場頁面實際建立浮動快速操作按鈕|4\.7\.2 母法最上方加入簡易研判與缺漏事證，成立且無待查時標示違反法規|4\.7\.2 母法頁建立專用浮動導覽，不出現現場結束與緊急按鍵|4\.7\.2 母法模板補丁在動態模板載入完成後套用|3\.0主入口直接進整合流程並只顯示日期時間|3\.0零候選自動轉第9條（記憶體測試資料）)$'
          tests/*.test.cjs

  package-windows:
    if: github.event_name == 'push'
    needs: node-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "const fs=require('fs');const s=fs.readFileSync('data/app-meta.js','utf8');const m=s.match(/version:\s*['\"]([^'\"]+)/);if(!m)process.exit(1);process.stdout.write(m[1]);")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Assemble Windows offline package
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          ROOT="dist/inspection-assistant-${VERSION}-windows"
          mkdir -p "$ROOT"
          cp index.html manifest.webmanifest service-worker.js start.cmd "$ROOT/"
          cp -R data src icons "$ROOT/"
          printf '%s\n' '稽查助手 Windows 離線版' '' '使用方式：' '1. 解壓縮整個資料夾。' '2. 雙擊 start.cmd。' '3. 會以預設瀏覽器開啟，無需安裝、無需網路。' '' '注意：請勿單獨搬動 index.html，data、src、icons 資料夾需一起保留。' > "$ROOT/WINDOWS-README.txt"
          cd dist
          zip -r "inspection-assistant-${VERSION}-windows.zip" "inspection-assistant-${VERSION}-windows"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: inspection-assistant-${{ steps.version.outputs.version }}-windows
          path: dist/inspection-assistant-${{ steps.version.outputs.version }}-windows.zip
          if-no-files-found: error
          retention-days: 30
