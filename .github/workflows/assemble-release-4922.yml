name: Assemble release 4.9.22 sources

on:
  push:
    branches:
      - release/4.9.22

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble verified local sources
        shell: bash
        run: |
          set -euo pipefail
          cat _release4922/payload.part1 _release4922/payload.part2 _release4922/payload.part3 _release4922/payload.part4 > /tmp/release4922-noise.tar.gz
          echo 'f40938003ad945af2de6ad65ec54e4ff63fab496fdc48a7da775bc15cfee5fca  /tmp/release4922-noise.tar.gz' | sha256sum -c -
          tar -xzf /tmp/release4922-noise.tar.gz
          test "$(git hash-object src/noise-main.js)" = "6c1433c542ea3763d3505020b6283fe2738ea8f2"
          test "$(git hash-object src/noise-approved-drafts.js)" = "0767a2c75fc22513e02f352294c496ecccc46a7c"
          rm -rf _release4922 .github/workflows/assemble-release-4922.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble verified 4.9.22 noise sources'
          git push origin HEAD:release/4.9.22
