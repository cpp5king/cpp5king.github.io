name: RC6 Official Law Snapshot

on:
  push:
    branches:
      - tmp-law-snapshot-rc6
    paths:
      - .github/workflows/rc6-law-snapshot.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build official law snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/data/law-assets tmp
          get_zip() {
            local out="$1"; shift
            local urls=("$@")
            local attempt=1
            while [ "$attempt" -le 16 ]; do
              local url="${urls[$(( (attempt-1) % ${#urls[@]} ))]}"
              echo "Download attempt $attempt: $url"
              rm -f "$out.part"
              curl --http1.1 -L --retry 2 --retry-all-errors --connect-timeout 20 --max-time 300 -A "Mozilla/5.0 InspectionAssistant/5.1" -o "$out.part" "$url" || true
              if unzip -t "$out.part" >/dev/null 2>&1; then
                mv "$out.part" "$out"
                echo "Valid ZIP: $out ($(wc -c < "$out") bytes)"
                return 0
              fi
              echo "Invalid/incomplete response: $(wc -c < "$out.part" 2>/dev/null || echo 0) bytes"
              head -c 120 "$out.part" 2>/dev/null | xxd || true
              sleep $(( attempt < 6 ? attempt : 6 ))
              attempt=$((attempt+1))
            done
            echo "Unable to obtain valid official ZIP: $out" >&2
            return 1
          }
          get_zip tmp/law.zip "https://law.moj.gov.tw/api/ch/law/json" "https://law.moj.gov.tw/api/Ch/Law/JSON"
          get_zip tmp/order.zip "https://law.moj.gov.tw/api/ch/order/json" "https://law.moj.gov.tw/api/Ch/Order/JSON"
          python - <<'PY'
          import io, json, os, re, urllib.parse, zipfile, hashlib, subprocess
          from datetime import datetime, timezone

          API_LAW='https://law.moj.gov.tw/api/ch/law/json'
          API_ORDER='https://law.moj.gov.tw/api/ch/order/json'
          TARGETS={
            'O0040001':'water-act',
            'O0040054':'water-measure-reg',
            'O0040055':'water-permit-reg',
            'O0040004':'effluent-standard',
            'O0030001':'noise-act',
            'O0030006':'noise-standard',
            'O0050001':'waste-act',
            'O0050036':'waste-rules',
            'O0020001':'air-act',
            'O0020036':'air-behavior-guideline',
            'O0020058':'construction-air-reg',
            'O0020127':'restaurant-air-reg',
            'O0020012':'fixed-permit-reg',
            'O0020006':'fixed-emission-standard',
          }

          def official(url):
            u=urllib.parse.urlparse(url)
            if u.scheme!='https' or u.hostname!='law.moj.gov.tw':
              raise RuntimeError('Non-official URL rejected: '+url)
            return url

          def curl_download(url,path,referer='https://law.moj.gov.tw/'):
            official(url)
            last=None
            for attempt in range(1,17):
              tmp=path+'.part'
              try:
                subprocess.run([
                  'curl','--http1.1','-fL','--retry','2','--retry-all-errors',
                  '--connect-timeout','20','--max-time','180',
                  '-A','Mozilla/5.0 InspectionAssistant/5.1',
                  '-e',referer,'-o',tmp,url
                ],check=True)
                with open(tmp,'rb') as f:
                  head=f.read(1024).lstrip().lower()
                size=os.path.getsize(tmp)
                is_html=(head.startswith(b'<!doctype html') or head.startswith(b'<html') or b'<title>error</title>' in head)
                if size>0 and not is_html:
                  os.replace(tmp,path)
                  return
                last=RuntimeError(f'HTML/error response ({size} bytes)')
              except Exception as e:
                last=e
              try: os.remove(tmp)
              except FileNotFoundError: pass
              import time
              time.sleep(min(attempt,5))
            raise RuntimeError('Unable to download official attachment after retries: '+url+' / '+str(last))

          def load_zip(path):
            with zipfile.ZipFile(path) as z:
              names=[n for n in z.namelist() if n.lower().endswith('.json')]
              if len(names)!=1: raise RuntimeError('Expected exactly one JSON in '+path)
              return json.loads(z.read(names[0]).decode('utf-8-sig'))

          def clean(v):
            return str(v or '').replace('\r\n','\n').strip()

          def next_heading(path,text):
            t=re.sub(r'[ \t]+',' ',clean(text))
            if not t:return path
            if t.startswith('第') and ('章' in t or '編' in t): return [t]
            if t.startswith('第') and '節' in t: return ([path[0],t] if path else [t])
            if t.startswith('第') and any(x in t for x in ('款','目')):
              return ([path[0],path[1],t] if len(path)>=2 else [*path,t])[-3:]
            return ([*path,t])[-3:]

          def norm_url(base,url):
            return official(urllib.parse.urljoin(base,str(url or '')))

          def safe_ext(name,url):
            ext=os.path.splitext(name)[1].lower()
            if not ext or not re.fullmatch(r'\.[a-z0-9]{1,8}',ext):
              ext=os.path.splitext(urllib.parse.urlparse(url).path)[1].lower()
            if not re.fullmatch(r'\.[a-z0-9]{1,8}',ext or ''): ext='.bin'
            return ext

          law=load_zip('tmp/law.zip')
          order=load_zip('tmp/order.zip')
          laws=list(law.get('Laws') or [])+list(order.get('Laws') or [])
          by={}
          for row in laws:
            url=str(row.get('LawURL') or '')
            m=re.search(r'[?&]pcode=([^&]+)',url,re.I)
            if m: by[m.group(1).upper()]=row

          missing=[p for p in TARGETS if p not in by]
          if missing: raise RuntimeError('Missing target laws: '+','.join(missing))

          entries={}
          asset_paths=[]
          meta=[]
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          law_pcodes={p for p in TARGETS if p in {x.upper() for x in by} and p in {'O0040001','O0030001','O0050001','O0020001'}}

          for pcode,eid in TARGETS.items():
            row=by[pcode]
            source_url=norm_url('https://law.moj.gov.tw/',row.get('LawURL'))
            heading=[]
            records=[]
            for a in row.get('LawArticles') or []:
              typ=str(a.get('ArticleType') or '')
              text=clean(a.get('ArticleContent'))
              if not text: continue
              if typ=='C':
                heading=next_heading(heading,text)
                records.append({'type':'C','no':'','text':text,'headingPath':heading[:]})
              else:
                records.append({'type':'A','no':clean(a.get('ArticleNo')),'text':text,'headingPath':heading[:]})

            attachments=[]
            raw_att=row.get('LawAttachements',row.get('LawAttachments',[])) or []
            for i,att in enumerate(raw_att,1):
              if not att or not att.get('FileURL'): continue
              name=str(att.get('FileName') or f'附件{i}')
              surl=norm_url(source_url,att.get('FileURL'))
              ext=safe_ext(name,surl)
              rel=f'data/law-assets/{pcode}/{i:02d}{ext}'
              path=os.path.join('out',rel)
              os.makedirs(os.path.dirname(path),exist_ok=True)
              curl_download(surl,path,source_url)
              with open(path,'rb') as f:data=f.read()
              if not data: raise RuntimeError('Empty attachment: '+surl)
              sha=hashlib.sha256(data).hexdigest()
              attachments.append({
                'name':name,'sourceUrl':surl,'localPath':rel,
                'sha256':sha,'size':len(data)
              })
              asset_paths.append('./'+rel)

            source_update = law.get('UpdateDate','') if pcode in law_pcodes else order.get('UpdateDate','')
            entries[eid]={
              'id':eid,'pcode':pcode,'name':str(row.get('LawName') or ''),
              'foreword':clean(row.get('LawForeword')),
              'histories':str(row.get('LawHistories') or ''),
              'amended':str(row.get('LawModifiedDate') or ''),
              'effectiveDate':str(row.get('LawEffectiveDate') or ''),
              'effectiveNote':str(row.get('LawEffectiveNote') or ''),
              'sourceName':'全國法規資料庫（法務部）',
              'sourceUrl':source_url,
              'sourceUpdateDate':source_update,
              'downloadedAt':now,
              'snapshotStatus':'complete-official-api-with-attachments',
              'articles':records,
              'attachments':attachments,
              'attachmentNote':('附件／附表共 %d 件，已隨本版離線收錄。'%len(attachments)) if attachments else ''
            }
            meta.append({
              'id':eid,'pcode':pcode,'name':entries[eid]['name'],
              'amended':entries[eid]['amended'],
              'articles':sum(1 for x in records if x['type']=='A'),
              'attachments':len(attachments)
            })

          snapshot={
            'provenance':'PP-IA-41-7F3C9A21',
            'version':'moj-official-snapshot-'+datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S'),
            'verifiedAt':datetime.now(timezone.utc).strftime('%Y-%m-%d'),
            'sourcePolicy':'中央法規全文、法規名稱、修正日期及附件一律由 law.moj.gov.tw 全國法規資料庫官方 API 直接取得；發布版本內建快照，使用者不需自行更新。',
            'officialApi':[API_LAW,API_ORDER],
            'lawUpdateDate':law.get('UpdateDate',''),
            'orderUpdateDate':order.get('UpdateDate',''),
            'entries':entries
          }

          os.makedirs('out/data',exist_ok=True)
          with open('out/data/law-fulltext.js','w',encoding='utf-8',newline='\n') as f:
            f.write("(function(root){'use strict';root.INSPECTION_LAW_FULLTEXT=Object.freeze(")
            json.dump(snapshot,f,ensure_ascii=False,separators=(',',':'))
            f.write(");})(window);\n")

          with open('out/data/law-offline-assets.js','w',encoding='utf-8',newline='\n') as f:
            f.write("self.INSPECTION_LAW_OFFLINE_ASSETS=")
            json.dump(asset_paths,f,ensure_ascii=False,separators=(',',':'))
            f.write(";\n")

          with open('out/LAW-SNAPSHOT-META.json','w',encoding='utf-8') as f:
            json.dump({
              'source':'https://law.moj.gov.tw/',
              'lawApi':API_LAW,'orderApi':API_ORDER,
              'lawUpdateDate':law.get('UpdateDate',''),
              'orderUpdateDate':order.get('UpdateDate',''),
              'generatedAt':now,'entries':meta
            },f,ensure_ascii=False,indent=2)

          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY

      - name: Package snapshot
        shell: bash
        run: |
          cd out
          zip -r ../rc6-law-snapshot.zip .

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc6-law-snapshot
          path: rc6-law-snapshot.zip
          if-no-files-found: error
          retention-days: 1
